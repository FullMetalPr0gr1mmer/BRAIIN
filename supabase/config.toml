# Minimal Supabase local config for `supabase start` + `supabase test db` (pgTAP).
# The CLI merges its defaults for omitted sections. Regenerate with `supabase init`
# if a newer CLI requires more. Real project linking happens during provisioning.
project_id = "braiin-station"

[db]
port = 54322
major_version = 15

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[auth]
enabled = true
# Admin v2 F8: the auth server's own floor for a new password, equal to the admin's
# (PASSWORD_MIN, packages/schemas/adminPrefs.ts), so a password set at Supabase Auth
# directly (PUT /auth/v1/user with a session token) is held to the same length as one set
# through the admin. Staging and production set it in the dashboard (launch runbook §2a,
# owner item O-24). tests/lib/accountPassword.spec.ts holds the two numbers equal.
minimum_password_length = 10

# Admin v2 F8: "Secure password change". At the auth server, a session older than 24 hours
# cannot change its password without a reauthentication code sent by e-mail. The admin's
# own route never needs one: it re-authenticates with the current password first, which
# starts a fresh session (src/lib/admin/account.ts), so a password change asks nothing of
# SMTP (O-2). Requiring the current password itself has no key in this file (CLI 2.118);
# the hosted projects set it (runbook §2a), and docs/admin-v2/deviations.md records the gap.
[auth.email]
secure_password_change = true
# Admin v2 F7: a reset link lasts one hour, as the forgot screen says ("The link works for one
# hour", src/lib/auth/messages.ts; tests/lib/authScreens.spec.ts holds the two together).
# The CLI's default too, pinned so a change is a choice. Hosted projects: Email OTP
# Expiration, launch runbook §2b step 4.
otp_expiry = 3600

# Admin v2 U12b: the invite e-mail. Its link opens /admin/invite with the token hash, which
# the page's form posts to the server (never the default ConfirmationURL, whose session would
# arrive in a # fragment). Hosted projects: Templates > Invite user, launch runbook §2b. An
# invite link lasts as long as a reset link (otp_expiry above, decision D1: one hour, with
# Resend); GoTrue has one expiry for both. tests/lib/inviteTemplate.spec.ts holds the link.
[auth.email.template.invite]
subject = "You are invited to the admin"
content_path = "./supabase/templates/invite.html"

# The Custom Access Token Hook (migration 0010), enabled for the LOCAL stack the way the
# launch runbook §2 enables it in the dashboard for staging and production. Without it a
# locally signed-in user's JWT carries no role or tenant claim, every admin sign-in is
# refused (correctly: resolveAuthContext treats the session as anonymous), and no admin
# journey can run in CI. The e2e harness (tests/admin, Admin v2 F0) depends on it.
# pgTAP is unaffected: it injects claims with set_config and never mints a token.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
