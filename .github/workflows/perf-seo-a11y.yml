name: Perf / SEO / A11y / E2E

# Runs the browser gates the standard calls blocking — Lighthouse budgets (CLAUDE.md §6),
# axe WCAG 2.2 AA, CSP, served-markup and video-bytes checks (§9) and every Playwright
# spec — against the BUILT Worker, served by `wrangler dev`, reading a real database.
#
# CALLED BY ci.yml (job `perf-seo-a11y`) on every PR and every push to main — it has no
# push/PR trigger of its own, so a commit gets one run ("CI"), and on main the deploy waits
# for both jobs here. Until 2026-10-04 this was a separate workflow that finished ~25 min
# after the Worker was already live, so a red e2e or Lighthouse result shipped anyway.
# Both jobs are REQUIRED status checks on `main`, as "perf-seo-a11y / <job name>"
# (.github/branch-protection.json): renaming a job means updating that file and
# re-applying protection in the same PR (launch runbook §5b). `workflow_dispatch` keeps a
# manual run. (Staged on `workflow_dispatch` until 2026-09-25, these suites had never gated
# a single PR: a staged gate is an untested gate.)
#
# WHY A LOCAL SUPABASE, NOT DUMMIES. The previous version built against
# `https://example.supabase.co`, so every loader returned [] and every page rendered its
# empty/fallback state: /portfolio was an empty list, every /portfolio/<slug> a 404, and
# axe/Lighthouse/CSP audited pages no visitor ever sees. `supabase start` applies
# supabase/migrations and supabase/seed.sql, and its real local keys are exported into
# the BUILD environment. PUBLIC_* are inlined at build time; the server secrets are written
# by scripts/local-preview-config.mjs to dist/server/.preview.env and handed to the Worker
# with `wrangler dev --env-file` (it does not read the adapter's dist/server/.dev.vars, and
# CI has no project .env). Only secrets with no local counterpart stay dummies.
#
# No `concurrency` here: ci.yml's run-level group already cancels a superseded PR run, and a
# group inside the call could cancel or stall a gate the deploy waits for.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The preview origin is local by design; the prebuild guard needs the explicit opt-out.
  # This env stays inside this called workflow: the deploy jobs in ci.yml never see it.
  PUBLIC_SITE_URL: http://localhost:8788
  ALLOW_LOCAL_SITE_URL: '1'
  PREVIEW_URL: http://localhost:8788
  # No local counterpart — dummy, never used for a real write in these suites.
  LEAD_PII_ENC_KEY: ci-dummy-lead-pii-enc-key
  AUDIT_HMAC_KEY: ci-dummy-audit-hmac-key
  NOTIFY_LEAD_SECRET: ci-dummy-notify-lead-secret
  # Containers the browser suites never touch; skipping them roughly halves `supabase start`.
  SUPABASE_EXCLUDE: studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta

jobs:
  e2e:
    name: E2E + axe + CSP + video bytes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # As above, but WITH storage-api: tests/e2e/apply-roundtrip.e2e.ts sends one real Join
      # application, and its CV must reach the private `applications` bucket (migration
      # 0029). imgproxy stays out — storage runs without image transformations.
      SUPABASE_EXCLUDE: studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta
    steps:
      - uses: actions/checkout@v4 # TODO: Renovate pins actions to SHAs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` asks the GitHub API for the newest release on every job, and a
          # burst of parallel runs hits its rate limit ("Failed to resolve latest Supabase CLI
          # release") and fails the gate for no code reason. Bump deliberately (supply chain).
          version: 2.118.0
      - run: npm ci
      - name: Start Supabase (migrations + seed.sql)
        run: supabase start -x "$SUPABASE_EXCLUDE"
      - name: Export local Supabase into the build environment
        run: |
          eval "$(supabase status -o env)"
          {
            echo "PUBLIC_SUPABASE_URL=${API_URL}"
            echo "PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "SUPABASE_DB_POOL_URL=${DB_URL}"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - name: Preview config (local KV simulation, no Cloudflare credentials)
        run: node scripts/local-preview-config.mjs
      # Authored redirects (Round 3): the admin's table reaches the edge as a KV snapshot,
      # and redirects.e2e.ts tests what the edge DOES with one, not the admin journey that
      # writes it, so the snapshot is seeded straight into the local KV the preview reads
      # (the signed-in admin journeys are tests/admin, Admin v2 F0). Run from the
      # repo root AFTER the preview config: wrangler follows the build's
      # .wrangler/deploy/config.json redirect, so the key lands in the same .wrangler/state
      # `wrangler dev` opens (`--config dist/server/wrangler.json` would persist under
      # dist/server/.wrangler and the Worker would never see it — measured). `--preview`
      # targets the namespace `wrangler dev` binds. The JSON must equal SEEDED_MAP in
      # tests/e2e/redirects.e2e.ts.
      - name: Seed the authored-redirects snapshot into local KV
        run: >-
          npx wrangler kv key put site:redirects
          '{"/e2e-old":{"to":"/about","status":301},"/e2e-temp":{"to":"/contact?from=e2e","status":302},"/e2e-anchor":{"to":"/services#e2e","status":308},"/api/e2e-old":{"to":"/about","status":301}}'
          --binding SESSION --local --preview
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start preview (wrangler dev)
        run: npx wrangler dev --port 8788 --env-file dist/server/.preview.env &
      - name: Wait for preview
        run: npx wait-on http://localhost:8788 --timeout 90000
      # Includes the signed-in admin sweep (tests/admin): the `admin-setup` project creates
      # one staff account per role in THIS job's local Supabase (the hook in
      # supabase/config.toml stamps their roles) and saves each role's session; the sweep
      # then opens every screen each role's sidebar offers. Nothing is seeded for it.
      - name: Playwright (e2e, axe WCAG 2.2 AA, CSP, served HTML, video bytes, admin sweep)
        run: npm run test:e2e
      # Not an assertion, so it never fails the gate (the deploy waits for this job).
      - name: Design capture (public + admin full-page screenshots for the mockup comparison, not assertions)
        if: always()
        continue-on-error: true
        env:
          CAPTURE_DIR: visual-capture
        run: npx playwright test tests/visual/capture.e2e.ts tests/admin/capture.e2e.ts --retries=0
      - name: Upload design capture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-capture
          path: visual-capture
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Supabase
        if: always()
        run: supabase stop

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4 # TODO: Renovate pins actions to SHAs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` asks the GitHub API for the newest release on every job, and a
          # burst of parallel runs hits its rate limit ("Failed to resolve latest Supabase CLI
          # release") and fails the gate for no code reason. Bump deliberately (supply chain).
          version: 2.118.0
      - run: npm ci
      - name: Start Supabase (migrations + seed.sql)
        run: supabase start -x "$SUPABASE_EXCLUDE"
      - name: Export local Supabase into the build environment
        run: |
          eval "$(supabase status -o env)"
          {
            echo "PUBLIC_SUPABASE_URL=${API_URL}"
            echo "PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "SUPABASE_DB_POOL_URL=${DB_URL}"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - name: Preview config (local KV simulation, no Cloudflare credentials)
        run: node scripts/local-preview-config.mjs
      - name: Start preview (wrangler dev)
        run: npx wrangler dev --port 8788 --env-file dist/server/.preview.env &
      - name: Wait for preview
        run: npx wait-on http://localhost:8788 --timeout 90000
      - name: Lighthouse budgets (mobile — Lighthouse default emulation)
        run: npm run lhci
      # The desktop geometry is where the hero intro/headline collision lived: it was
      # invisible at Lighthouse's default 412x823 mobile viewport and at >=1700px wide,
      # and present on every laptop in between. A mobile-only perf gate cannot see a
      # class of defect that only exists on desktop widths.
      - name: Lighthouse budgets (desktop)
        run: npm run lhci:desktop
      - name: Stop Supabase
        if: always()
        run: supabase stop
