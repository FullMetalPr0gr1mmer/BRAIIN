name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pillar-ordered gates (CLAUDE.md §8): typecheck → schema/unit → build → supply-chain.
  # (perf-budgets, seo-schema, a11y, visual-regression run in perf-seo-a11y.yml, which
  #  activates in Phase 1 when real pages exist.)
  build-test:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://www.braiinstation.com
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      # astro:env validates the server schema too. These are DUMMY, non-functional values
      # so the build can run in CI (real values live in Cloudflare Worker Secrets / Vault).
      SUPABASE_DB_POOL_URL: postgresql://ci:ci@localhost:6543/ci
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      LEAD_PII_ENC_KEY: ci-dummy-lead-pii-enc-key
      AUDIT_HMAC_KEY: ci-dummy-audit-hmac-key
      NOTIFY_LEAD_SECRET: ci-dummy-notify-lead-secret
    steps:
      - uses: actions/checkout@v4 # TODO: Renovate pins actions to SHAs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (astro check — .astro + ts)
        run: npm run check
      - name: Typecheck (tsc — tests + packages)
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Unit + schema + authz tests
        run: npm run test
      # CLAUDE.md Pillar 3 names a blocking `seo-ci` gate. It is listed separately from
      # `npm test` (which already runs these) so the pillar-ordered gate is VISIBLE as its
      # own red/green step — a requirement folded invisibly into another job is one nobody
      # can tell is enforced.
      - name: SEO — JSON-LD types, robots/llms snapshot, sitemap twins (blocking)
        run: npm run seo-ci

      - name: A11y — WCAG AA contrast gate (token-level, browser-free)
        run: npm run a11y:contrast
      - name: Build (Cloudflare adapter)
        run: npm run build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO: Renovate pins actions to SHAs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocking: high+critical in PRODUCTION deps (what ships in the Worker bundle).
      # Accepted advisories are documented + expiring in scripts/audit-gate.mjs — no
      # blanket suppression. Fails on any new prod high/critical or an expired entry.
      - name: Audit — production deps (blocking, documented allowlist)
        run: npm run audit
      # Blocking as of 2026-08-01 (closes EXC-001). This step carried `|| true` for six
      # weeks because the whole tree reported 27 vulnerabilities — 1 critical + 9 high —
      # every one of them in build/dev/test tooling absent from the deployed Worker.
      # Clearing them took a Node 22 + Astro 7 migration (KAN-31), then `vitest` 2→4,
      # `@lhci/cli` 0.14→0.15 and a `tmp` override; the tree is now 0 high / 0 critical.
      #
      # It is blocking rather than informational because CLAUDE.md §3 says "npm audit high"
      # without qualification, and because an advisory in dev tooling is still an advisory
      # in code that runs on developer machines and in CI with repository credentials —
      # "it never ships" bounds the blast radius, it does not zero it.
      #
      # Via the gate script, not a bare `npm audit --audit-level=high`: the advisory
      # database changes without this repo changing, so this step can go red on a commit
      # that touched nothing. The script gives that situation a documented, EXPIRING
      # answer instead of forcing someone to re-add `|| true` during an incident.
      - name: Audit — full tree incl. dev (blocking, documented allowlist)
        run: npm run audit:all
